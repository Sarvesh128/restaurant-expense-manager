version: '3.8'

services:
  # MongoDB Database Service
  mongodb:
    image: mongo:6.0
    container_name: restaurant_expense_mongodb
    restart: always
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: restaurant_expense_db
    volumes:
      - mongodb_data:/data/db

  # Node.js + Express Backend API Service
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: restaurant_expense_backend
    restart: always
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      NODE_ENV: development
      MONGODB_URI: mongodb://mongodb:27017/restaurant_expense_db
      AI_SERVICE_URL: http://ai-service:8000
    depends_on:
      - mongodb
    volumes:
      - ./backend:/usr/src/app
      - /usr/src/app/node_modules

  # Python FastAPI AI/ML & OCR Microservice
  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    container_name: restaurant_expense_ai_service
    restart: always
    ports:
      - "8000:8000"
    environment:
      PORT: 8000
      DEBUG: "True"
    volumes:
      - ./ai-service:/usr/src/app

  # React + Vite Frontend UI Service
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: restaurant_expense_frontend
    restart: always
    ports:
      - "3000:3000"
    environment:
      VITE_API_BASE_URL: http://localhost:5000/api/v1
    depends_on:
      - backend

volumes:
  mongodb_data:
